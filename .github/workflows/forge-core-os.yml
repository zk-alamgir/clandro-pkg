name: Forge Core OS (aarch64)

on:
  workflow_dispatch:

jobs:
  build-core:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/termux/package-builder:latest
      options: --privileged
    steps:
      - name: Checkout Sovereign Code
        uses: actions/checkout@v4

      - name: Architect the Custom OS Directories
        run: |
          sudo mkdir -p /data/data/com.zk.clandro/files/usr
          sudo mkdir -p /data/data/com.zk.clandro/files/home
          sudo chown -R builder:builder /data/data/com.zk.clandro

      - name: Install the C++ Compiler (The Missing NDK)
        run: |
          export HOME=/home/builder
          ./scripts/setup-android-sdk.sh

      - name: Forge the Bedrock (Core Libraries)
        run: |
          export HOME=/home/builder
          # We explicitly build the system roots first without the Ignore (-I) flag.
          # This puts libc.so and the compiler tools into your clandro prefix!
          ./build-package.sh -a aarch64 ndk-sysroot
          ./build-package.sh -a aarch64 libandroid-support

      - name: Forge Tier 1 Packages (Native Execution)
        run: |
          export HOME=/home/builder
          # Now the compiler has a foundation to stand on. We build the rest.
          # Removing -I allows it to naturally build ncurses and readline for bash.
          ./build-package.sh -a aarch64 bash
          ./build-package.sh -a aarch64 coreutils
          ./build-package.sh -a aarch64 dpkg
          ./build-package.sh -a aarch64 apt
          ./build-package.sh -a aarch64 termux-tools
          ./build-package.sh -a aarch64 ca-certificates

      - name: Generate APT Index
        run: |
          export HOME=/home/builder
          sudo apt-get update && sudo apt-get install -y dpkg-dev
          mkdir -p output
          cd output
          dpkg-scanpackages -m . > Packages
          gzip -9c Packages > Packages.gz

      - name: Upload Core OS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cl-andro-core-debs-aarch64
          path: output/
