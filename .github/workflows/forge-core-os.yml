name: Forge Core OS (aarch64)

on:
  workflow_dispatch:

jobs:
  build-core:
    runs-on: ubuntu-latest
    # THIS IS THE BYPASS. We run the entire job INSIDE Termux's official builder environment.
    # No setup scripts required. The NDK and Python 3.12 are already baked into this image.
    container:
      image: ghcr.io/termux/package-builder:latest
    steps:
      - name: Checkout Sovereign Code
        uses: actions/checkout@v4

      - name: Fix Workspace Permissions
        run: sudo chown -R $(whoami) .

      - name: Forge Tier 1 Packages (Direct Compile)
        run: |
          # The compilers are already installed. We just run the builds directly.
          ./build-package.sh -I -a aarch64 bash
          ./build-package.sh -I -a aarch64 coreutils
          ./build-package.sh -I -a aarch64 dpkg
          ./build-package.sh -I -a aarch64 apt
          ./build-package.sh -I -a aarch64 ncurses
          ./build-package.sh -I -a aarch64 readline
          ./build-package.sh -I -a aarch64 termux-tools
          ./build-package.sh -I -a aarch64 ca-certificates

      - name: Generate APT Index
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev || true
          mkdir -p output
          cd output
          dpkg-scanpackages -m . > Packages
          gzip -9c Packages > Packages.gz

      - name: Upload Core OS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cl-andro-core-debs-aarch64
          path: output/