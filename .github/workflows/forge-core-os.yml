name: Forge Core OS (aarch64)

on:
  workflow_dispatch:

jobs:
  build-core:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Sovereign Code
        uses: actions/checkout@v4

      - name: Free Disk Space (Maximize Build RAM)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true

      - name: Sever Cloud Ties
        run: |
          # Mutate the build scripts so they never pull Termux's official pre-built image
          sed -i 's|ghcr.io/termux/package-builder:latest|cl-andro-builder:latest|g' scripts/build-docker-image.sh scripts/run-docker.sh || true
          sed -i 's|ghcr.io/termux/package-builder|cl-andro-builder|g' scripts/build-docker-image.sh scripts/run-docker.sh || true

      - name: Forge the DNA Chamber (Custom Docker Image)
        run: |
          # This takes ~10 minutes. It builds a completely fresh Docker container 
          # that permanently bakes com.zk.clandro into the Android C++ compilers.
          sudo ./scripts/build-docker-image.sh

      - name: Forge Tier 1 Packages
        run: |
          # Now we run the builds natively through our custom container!
          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 bash
          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 coreutils
          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 dpkg
          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 apt
          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 ncurses
          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 readline
          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 termux-tools
          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 ca-certificates

      - name: Generate APT Index
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev
          mkdir -p output
          cd output
          dpkg-scanpackages -m . > Packages
          gzip -9c Packages > Packages.gz

      - name: Upload Core OS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cl-andro-core-debs-aarch64
          path: output/
