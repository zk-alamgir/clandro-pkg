name: Forge Core OS (aarch64)

on:
  workflow_dispatch:

jobs:
  build-core:
    runs-on: ubuntu-latest # It doesn't matter what OS GitHub gives us anymore
    steps:
      - name: Checkout Sovereign Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true

      - name: Download Android NDK (The Missing Link)
        run: |
          # This script ONLY downloads the NDK. It does not use apt-get.
          # It completely bypasses the Ubuntu 22.04 vs 24.04 error.
          ./scripts/setup-android-sdk.sh

      - name: Forge Tier 1 Packages (Inside Isolated Docker)
        run: |
          # This spins up Termux's official isolated 24.04 container,
          # mounts the NDK we just downloaded, and compiles safely inside it.
          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 bash
          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 coreutils
          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 dpkg
          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 apt
          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 ncurses
          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 readline
          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 termux-tools
          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 ca-certificates

      - name: Generate APT Index
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev
          # The docker container spits the compiled .deb files into the output folder
          mkdir -p output
          cd output
          dpkg-scanpackages -m . > Packages
          gzip -9c Packages > Packages.gz

      - name: Upload Core OS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cl-andro-core-debs-aarch64
          path: output/